[package]
name = "phoenix-terminal"
version = "0.1.0"
description = "PHOENIX read-only trading terminal"
authors = ["PHOENIX"]
edition = "2021"

[lib]
name = "phoenix_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
